<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Titles — Sojourn Midtown</title>
<style>
  :root{
    --booth-black:#0d0d0f;
    --panel:#16161a;
    --edge:#26262c;
    --working-gold:#bfa267;
    --display-gold:#e2b749;
    --liturgy-blue:#285264;
    --text:#f2efe8;
    --dim:#8b8b93;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--booth-black);
    color:var(--text);
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 48px;
  }
  header{width:100%;max-width:640px;margin-bottom:22px}
  .eyebrow{
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--working-gold);margin-bottom:6px;
  }
  h1{font-size:22px;font-weight:600;letter-spacing:.01em}
  h1 .date{color:var(--dim);font-weight:400}
  .block{
    width:100%;max-width:640px;
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:14px;
    padding:20px 22px 22px;
    margin-bottom:18px;
  }
  .label{
    font-size:18px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--display-gold);
    margin-bottom:10px;
  }
  .slide{
    background:#000;
    border-radius:8px;
    padding:22px 20px;
    margin-bottom:16px;
    border-left:3px solid var(--working-gold);
  }
  pre{
    font-family:inherit;
    font-size:clamp(15px,2.4vw,18px);
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    color:var(--text);
  }
  .copybtn{
    width:100%;padding:16px 0;
    font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    background:var(--display-gold);
    color:#141414;
    border:none;border-radius:10px;
    cursor:pointer;
    transition:transform .08s, background .2s;
  }
  .copybtn:active{transform:scale(.985)}
  .copybtn.copied{background:var(--liturgy-blue);color:var(--text)}
  .copybtn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  .hint{margin-top:4px;font-size:12px;color:var(--dim);text-align:center}
  footer{margin-top:12px;font-size:11px;color:var(--dim);letter-spacing:.04em}
  @media (prefers-reduced-motion: reduce){
    .copybtn{transition:none}
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Sojourn Midtown &middot; Switcher</div>
  <h1>Stream titles <span class="date" id="dateline"></span></h1>
</header>

<section class="block">
  <div class="label">Title</div>
  <div class="slide"><pre id="title-text"></pre></div>
  <button class="copybtn" id="copy-title">Copy title</button>
</section>

<section class="block">
  <div class="label">Description</div>
  <div class="slide"><pre id="desc-text"></pre></div>
  <button class="copybtn" id="copy-desc">Copy description</button>
</section>

<div class="hint">Paste directly into YouTube / Facebook — no retyping.</div>
<footer>sojournmidtown.com/sermons</footer>

<script>
  // ---- weekly text: overridden by ?t= and ?d= URL params (URI-encoded) ----
  var FALLBACK_TITLE = "08.09.26 The Unveiling \u00B7 Jamaal Williams";
  var FALLBACK_DESC = "August 9, 2026 Sunday Service Livestream\nUnveiled: Revelation for the Waiting Church - The Unveiling\nRevelation 1:1-8\nsojournmidtown.com/sermons";

  var q = new URLSearchParams(location.search);
  var TITLE = q.get("t") || FALLBACK_TITLE;
  var DESC = q.get("d") || FALLBACK_DESC;

  var firstLine = DESC.split("\n")[0] || "";
  var m = firstLine.match(/^([A-Z][a-z]+ \d{1,2}, \d{4})/);
  document.getElementById("dateline").textContent = m ? "\u2014 " + m[1] : "";

  document.getElementById("title-text").textContent = TITLE;
  document.getElementById("desc-text").textContent = DESC;

  function wire(btnId, getText, label){
    var btn = document.getElementById(btnId);
    btn.addEventListener("click", function(){
      var txt = getText();
      function done(){
        btn.textContent = "Copied \u2713";
        btn.classList.add("copied");
        setTimeout(function(){
          btn.textContent = label;
          btn.classList.remove("copied");
        }, 1600);
      }
      function fallback(){
        var ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta);
        ta.select(); document.execCommand("copy"); ta.remove(); done();
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, fallback);
      } else { fallback(); }
    });
  }
  wire("copy-title", function(){return TITLE;}, "Copy title");
  wire("copy-desc", function(){return DESC;}, "Copy description");
</script>
</body>
</html>
